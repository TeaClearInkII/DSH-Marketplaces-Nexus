# dsh-marketplaces-nexus bundle patch: inserts this plugin into a profile's
# layer stack. 格式与官方 bundle（@deepseek-ai/dsh-base / dshmarket）一致：
# 顶层为纯 insert（无 id），行会追加到 profile 根 entry list。
# 注意：不能用 `- id: ...` 直接覆盖形式——空 root 中无匹配目标会被跳过。
- insert:
    - id: nexus-market-panel
      name: 'dsh-marketplaces-nexus'
